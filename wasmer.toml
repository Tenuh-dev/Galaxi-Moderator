[package]
name = "tenuh-dev/galaxi-moderator"
version = "1.0.0"
description = "Galaxi Auto Moderator Bot for Discord"
license = "MIT"

[[command]]
name = "start"
module = "wasmer/node:node"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
main-args = ["/app/dist/index.js"]
env = ["DISCORD_BOT_TOKEN", "LOG_CHANNEL_ID", "MAX_WARNS_BEFORE_KICK", "MAX_WARNS_BEFORE_BAN", "SPAM_THRESHOLD", "SPAM_INTERVAL_MS", "MAX_MENTIONS"]

[fs]
"/app" = "."
